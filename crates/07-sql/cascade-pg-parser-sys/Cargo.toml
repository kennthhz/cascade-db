[package]
name        = "cascade-pg-parser-sys"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Raw FFI bindings to libpg_query. Unsafe. Wrapped by cascade-pg-parser. See ADR 0002."

# NOTE: when libpg_query is vendored in Phase 4, this manifest gains:
#   links = "pg_query"
#   [build-dependencies]
#   cc      = "1"
#   bindgen = "0.69"  # optional; hand-written bindings also viable
# along with a build.rs alongside this file. Until then we ship as a pure-Rust
# stub so the workspace builds without a C toolchain.

[dependencies]
libc = { workspace = true }

[package]
name        = "cascade-types"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Shared primitive types for Cascade DB (PageId, Lsn, Xid, DatabaseId, AlignedBuf, ...)."

[dependencies]
# Foundation layer — depends on nothing above it: `Span` comes from the
# sibling foundation telemetry crate (storage M0's `OpCtx` carries a `&Span`,
# storage-layer-design.md §4.2).
cascade-telemetry = { workspace = true }

[dev-dependencies]
static_assertions = { workspace = true }
